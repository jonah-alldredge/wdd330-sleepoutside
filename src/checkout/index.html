<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header"></header>
    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form name="checkout" id="checkout-form">
        <fieldset class="checkout_name">
          <legend>Customer Name</legend>
      
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" autocomplete="given-name" required>
      
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" autocomplete="family-name" required>
        </fieldset>
      
        <fieldset class="checkout_address">
          <legend>Address</legend>
      
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" autocomplete="street-address" required>
      
          <label for="city">City</label>
          <input type="text" id="city" name="city" autocomplete="address-level2" required>
      
          <label for="state">State</label>
          <input type="text" id="state" name="state" autocomplete="address-level1" required>
      
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5"
            title="Enter a 5-digit zip code" autocomplete="postal-code" required>
        </fieldset>
      
        <fieldset class="checkout_payment">
          <legend>Payment</legend>
      
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" pattern="[0-9]{16}" maxlength="16"
            title="Enter a 16-digit card number" autocomplete="cc-number" required>
      
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" pattern="(0?[1-9]|1[0-2])\/[0-9]{2}"
            title="Use the format MM/YY (example: 8/27)" autocomplete="cc-exp" required>
      
          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4"
            title="Enter the 3 or 4 digit security code" autocomplete="cc-csc" required>
        </fieldset>
        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>

          <div class="order_summary">
            <div>Items: <a id="num-items"></a></div>
            <div>Subtotal: <a id="cartTotal"></a></div>
            <div>Tax: <a id="tax"></a></div>
            <div>Shipping: <a id="shipping"></a></div>
            <div>Total: <a id="orderTotal"></a></div>
          </div>
        </fieldset>
      
        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
